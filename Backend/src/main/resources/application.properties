spring.application.name=Dalil_sante

# DATABASE CONFIGURATION
# Ces valeurs peuvent etre surchargees via des variables d'environnement
# (DB_URL, DB_USERNAME, DB_PASSWORD) sans rien changer au code.
# Les valeurs apres ":" sont des valeurs par defaut utilisees uniquement
# si la variable d'environnement correspondante n'est pas definie
# (pratique pour lancer le projet en local sans configuration supplementaire).

#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dalil_sante}
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres}
#spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres.mkcmlzaoiwifzoqvebve}
#spring.datasource.password=${DB_PASSWORD:C29010@?}
spring.datasource.password=${DB_PASSWORD:C29010@?sidi}
# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SERVER

server.port=${SERVER_PORT:8080}

# ==========================
# JWT Configuration
# (surchargeables via JWT_SECRET / JWT_EXPIRATION)
# ==========================

jwt.secret=${JWT_SECRET:4B8F2E9C7A5D1F6E3A9B2C8D7F5E1A6C9B4D8F2A7E5C1D6B9A3F8E2C7D5A1B6}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# Compte administrateur cree automatiquement au premier demarrage
# (surchargeables via ADMIN_DEFAULT_EMAIL / ADMIN_DEFAULT_PASSWORD / ADMIN_DEFAULT_TELEPHONE)
# ==========================

app.admin.email=${ADMIN_DEFAULT_EMAIL:admin@dalilsante.mr}
app.admin.password=${ADMIN_DEFAULT_PASSWORD:Admin123!}
app.admin.telephone=${ADMIN_DEFAULT_TELEPHONE:22222222}

# ==========================
# Stockage des fichiers PDF (Conseils de sante)
# (surchargeables via UPLOAD_DIR / UPLOAD_MAX_PDF_SIZE_MB)
# La limite technique multipart est alignee sur la meme valeur pour que ce
# soit toujours le message metier clair (PdfValidationException) qui
# s'affiche, plutot qu'une erreur generique du serveur.
# ==========================

app.upload.dir=${UPLOAD_DIR:uploads/conseils}
app.upload.max-pdf-size-mb=${UPLOAD_MAX_PDF_SIZE_MB:10}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_PDF_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_PDF_SIZE_MB:10}MB